<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icons must fill the canvas; the mark stays inside the safe zone. -->
  <rect width="512" height="512" fill="#fffaf5"/>

  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa04d"/>
      <stop offset="100%" stop-color="#f48c25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#181411" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- The existing HoTube mark, scaled to fit the maskable 40% radius safe zone. -->
  <g transform="translate(256 256) scale(2.816) translate(-50 -50)">
    <circle cx="18" cy="18" r="18" fill="url(#orangeGrad)"/>
    <circle cx="82" cy="18" r="18" fill="url(#orangeGrad)"/>
    <circle cx="50" cy="55" r="45" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <path d="M38 35 L38 75 L70 55 Z" fill="white"/>
  </g>
</svg>
