<script>
        // Micro-interactions for chips
        const chips = document.querySelectorAll('button[class*="rounded-full"]');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                    c.classList.add('bg-surface-container', 'text-on-surface-variant', 'border', 'border-outline-variant');
                });
                chip.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                chip.classList.remove('bg-surface-container', 'text-on-surface-variant', 'border', 'border-outline-variant');
            });
        });

        // Simple scroll parallax or reveal could be added here for higher-end feel
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md');
            } else {
                header.classList.remove('shadow-md');
            }
        });
    </script>
